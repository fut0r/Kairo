[workspace]
members = [".", "crates/kairo-core", "desktop/src-tauri"]
# The desktop crate needs a webview toolkit to build. Leaving it out of the
# defaults keeps `cargo build` and `cargo test` to the CLI and the core.
default-members = [".", "crates/kairo-core"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Zyad Mohamed (fut0r)"]
repository = "https://github.com/fut0r/Kairo"
homepage = "https://kairo.arabdev.site"

[workspace.dependencies]
kairo-core = { path = "crates/kairo-core", version = "1.0.0" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", default-features = false }

[profile.release]
strip = true
lto = "thin"

[package]
name = "kairo"
description = "Human-readable databases. Minimal. Fast. Local-first."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "kairo"
path = "src/lib.rs"

[[bin]]
name = "kairo"
path = "src/main.rs"

[[bin]]
name = "kairodb"
path = "src/bin/kairodb.rs"

[dependencies]
kairo-core.workspace = true
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
tokio = { workspace = true, features = ["rt-multi-thread"] }
