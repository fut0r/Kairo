name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The command line tool. Asset names are unchanged from earlier releases,
  # so existing download links and install scripts keep working.
  cli:
    name: CLI - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: kairo
            asset: kairo-linux
          - os: windows-latest
            binary: kairo.exe
            asset: kairo-windows.exe
          - os: macos-latest
            binary: kairo
            asset: kairo-macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --verbose
      - name: Rename binary
        shell: bash
        run: cp "target/release/${{ matrix.binary }}" "target/release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/release/${{ matrix.asset }}

  release:
    name: Create release
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: KairoDB ${{ github.ref_name }}
          body_path: docs/release-notes-1.0.0.md
          generate_release_notes: false
          files: |
            artifacts/kairo-linux/kairo-linux
            artifacts/kairo-windows.exe/kairo-windows.exe
            artifacts/kairo-macos/kairo-macos
            install.sh
            install.ps1

  # The desktop app. Each runner builds the installers for its own platform
  # and attaches them to the release created above.
  desktop:
    name: Desktop - ${{ matrix.os }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}
