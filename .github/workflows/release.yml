name: Release

# Runs when a version tag is pushed. It can also be started by hand from the
# Actions tab for a tag that already exists, to build or rebuild its release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, for example v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The command line tool. Asset names are unchanged from earlier releases,
  # so existing download links and install scripts keep working.
  cli:
    name: CLI - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: kairo
            asset: kairo-linux
          - os: windows-latest
            binary: kairo.exe
            asset: kairo-windows.exe
          - os: macos-latest
            binary: kairo
            asset: kairo-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --verbose
      - name: Rename binary
        shell: bash
        run: cp "target/release/${{ matrix.binary }}" "target/release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/release/${{ matrix.asset }}

  release:
    name: Create release
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Find the release notes
        id: notes
        shell: bash
        run: |
          file="docs/release-notes-${TAG#v}.md"
          [ -f "$file" ] || file=CHANGELOG.md
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: KairoDB ${{ env.TAG }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: false
          files: |
            artifacts/kairo-linux/kairo-linux
            artifacts/kairo-windows.exe/kairo-windows.exe
            artifacts/kairo-macos/kairo-macos
            install.sh
            install.ps1

  # The desktop app. Each runner builds the installers for its own platform
  # and attaches them to the release created above.
  desktop:
    name: Desktop - ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb, rpm, AppImage)
            os: ubuntu-22.04
            args: ''
          - name: Windows (msi, setup.exe)
            os: windows-latest
            args: ''
          - name: macOS Apple Silicon (dmg)
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel (dmg)
            os: macos-latest
            args: '--target x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ env.TAG }}
          args: ${{ matrix.args }}
